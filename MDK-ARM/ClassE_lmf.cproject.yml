project:
  packs:
    - pack: ARM::CMSIS@^6.2.0
    - pack: Keil::STM32F1xx_DFP@^2.4.1
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for ClassE_lmf
      add-path:
        - ../Core/Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - ../Drivers/STM32F1xx_HAL_Driver/Inc
        - ../Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - ../Drivers/CMSIS/Include
        - ../dwt_delay
        - ../lwevt
        - ../lwrb
        - ../multibutton
        - ../multitimer
        - ../midware/inc
        - ../pid
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32F103xB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: ClassE_lmf_ClassE_lmf.sct
  groups:
    - group: Application/MDK-ARM
      files:
        - file: startup_stm32f103xb.s
    - group: Application/User/Core
      files:
        - file: ../Core/Src/main.c
        - file: ../Core/Src/gpio.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/adc.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/dma.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/spi.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/tim.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/usart.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/stm32f1xx_it.c
        - file: ../Core/Src/stm32f1xx_hal_msp.c
    - group: Drivers/STM32F1xx_HAL_Driver
      files:
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_adc.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_adc_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_dma.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_cortex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_pwr.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_exti.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_spi.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim_ex.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_uart.c
          misc:
            - CPP:
                - -xc++
    - group: Drivers/CMSIS
      files:
        - file: ../Core/Src/system_stm32f1xx.c
    - group: lwrb
      files:
        - file: ../lwrb/lwrb/lwrb.c
        - file: ../lwrb/lwrb/lwrb_ex.c
    - group: dwt_delay
      files:
        - file: ../dwt_delay/dwt_delay.c
    - group: multibutton
      files:
        - file: ../multibutton/multi_button.c
    - group: multimer
      files:
        - file: ../multitimer/MultiTimer.c
    - group: Midware
      files:
        - file: ../midware/src/app_event.c
        - file: ../midware/src/bsp_fan_pid.c
        - file: ../midware/src/bsp_multibutton.c
        - file: ../midware/src/bsp_ringbuffer.c
        - file: ../midware/src/bsp_soft_timer.c
        - file: ../midware/src/app_callbacks.c
        - file: ../midware/src/bsp_led.c
        - file: ../midware/src/bsp_relay.c
        - file: ../midware/src/bsp_sys_ctrl.c
        - file: ../midware/src/rf_matching.c
        - file: ../midware/src/command_parser.c
    - group: pid
      files:
        - file: ../pid/PID.c
  components:
    - component: ARM::CMSIS:CORE
